version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - errcheck
    - exhaustive
    - forcetypeassert
    - govet
    - ineffassign
    - predeclared
    - staticcheck
    - unused
    - usetesting
formatters:
  enable:
    - goimports
